task_id: sprint-3-session-crud-api
summary: "Session CRUD API for VAP Section 6 lifecycle: create, get, update, close, expire. Backed by @verified-attention/core Session model."
depends_on: ["sprint-2-evidence-model-pipeline"]
language: TypeScript
project_root: "."
package_root: "apps/api"
target_package: "@verified-attention/api"
framework: Node.js + Vitest
build_cmd: "pnpm --filter @verified-attention/api build"
typecheck_cmd: "pnpm --filter @verified-attention/api typecheck"
test_cmd: "pnpm --filter @verified-attention/api test"
lint_cmd: "pnpm --filter @verified-attention/api lint"
acceptance:
  - "POST /v1/sessions creates a Session in CREATED state"
  - "GET /v1/sessions/:id returns the session or 404"
  - "PATCH /v1/sessions/:id updates participant/config (no illegal state mutation)"
  - "POST /v1/sessions/:id/close moves ACTIVE -> CANCELLED (and rejects from terminal states)"
  - "POST /v1/sessions/:id/expire moves ACTIVE/CREATED -> EXPIRED"
  - "openapi.yaml declares /sessions paths"
  - "Build, typecheck, lint, and tests all pass"

local_goals:
  - id: L1
    description: "INSPECT: existing core Session model + tests to discover contract"
    verification:
      type: cli
      command: "test -f packages/core/src/session.ts && test -f packages/core/src/session.test.ts"
      expect:
        exit_code: 0

  - id: L2
    description: "CREATE: apps/api package scaffold (package.json, tsconfig.json, tsdown.config.ts, src/index.ts, src/app.ts, vitest.config.ts)"
    verification:
      type: file_exists
      path: "apps/api/package.json"
      expect:
        content_contains: "@verified-attention/api"

  - id: L3
    description: "CREATE: Session CRUD modules in apps/api/src/sessions/ — router.ts, controller.ts, store.ts"
    verification:
      type: file_exists
      path: "apps/api/src/sessions/router.ts"
      expect:
        content_contains: "Router"

  - id: L4
    description: "CREATE: Session API tests in apps/api/src/sessions/sessions.test.ts covering create, get, update, close, expire, 404, bad state transition"
    verification:
      type: file_exists
      path: "apps/api/src/sessions/sessions.test.ts"
      expect:
        content_contains: "describe"

  - id: L5
    description: "MODIFY: Extend apps/api/openapi.yaml with /sessions paths and components"
    verification:
      type: cli
      command: "grep -q '/sessions' apps/api/openapi.yaml"
      expect:
        exit_code: 0

  - id: L6
    description: "MODIFY: Register apps/api in pnpm-workspace.yaml workspace globs"
    verification:
      type: cli
      command: "grep -q 'apps/\\*' pnpm-workspace.yaml"
      expect:
        exit_code: 0

  - id: L7
    description: "VERIFY: install, build, typecheck, lint, test all pass for @verified-attention/api"
    verification:
      type: cli
      command: "pnpm --filter @verified-attention/api typecheck && pnpm --filter @verified-attention/api build && pnpm --filter @verified-attention/api test"
      expect:
        exit_code: 0
